<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title></title>
    <script>
      (function () {
        if (window.history.length > 1) {
          window.history.back();
        } else if (document.referrer) {
          window.location.replace(document.referrer);
        }
      })();
    </script>
  </head>
  <body style="margin:0;background:#141414;"></body>
</html>
